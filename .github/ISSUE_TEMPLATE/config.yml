blank_issues_enabled: false
contact_links:
  # Security reports must not start as a public issue. SECURITY.md routes them
  # through GitHub's private vulnerability reporting instead; this entry exists
  # so the issue chooser says so before someone types a repro into a text box.
  - name: Security vulnerability
    url: https://github.com/SunWay0573/dsh-mobile/security/advisories/new
    about: Report privately. Please do not open a public issue for a security problem.
  - name: Something is not working
    url: https://github.com/SunWay0573/dsh-mobile/blob/main/docs/troubleshooting.md
    about: Organised by symptom, and says how to confirm each cause. Start here.
  - name: Setup guides — tunnel, power, waking
    url: https://github.com/SunWay0573/dsh-mobile/tree/main/docs
    about: The longer-form setup documentation.
